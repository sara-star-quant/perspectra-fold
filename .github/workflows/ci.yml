name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        run: |
          pytest -q

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust/mdqc-core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

  rust_compute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust/compute-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests
        run: cargo test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Format
        run: |
          test -z "$(gofmt -l .)"

      - name: Tests
        run: go test ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Integration test
        working-directory: src/go/control-plane
        run: |
          go test -tags=integration ./internal/coreclient -run TestCosineSimilarityGRPC

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: docs/.markdownlint-cli2.yaml
          globs: |
            docs/**/*.md
            *.md

      - name: Link check
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: >
            --verbose
            --no-progress
            --timeout 20
            --max-retries 2
            --exclude-mail
            --accept 200,429
            --exclude 'https://img.shields.io/.*'
            docs/**/*.md
            *.md
